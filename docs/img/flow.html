<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B8D98"/></marker></defs>
<text x="40" y="44" class="t" font-size="22">A check goes from paste to final verdict in six steps</text>
<g><rect x="40" y="90" width="170" height="110" rx="10" class="box"/><text x="60" y="118" class="m s q">01</text><text x="125" y="142" text-anchor="middle" class="n">Paste or link</text><text x="125" y="166" text-anchor="middle" class="s q">text, letter body,</text><text x="125" y="184" text-anchor="middle" class="s q">job-board URL</text></g>
<path d="M210 145H240" class="ln" marker-end="url(#a)"/>
<g><rect x="240" y="90" width="170" height="110" rx="10" class="box"/><text x="260" y="118" class="m s q">02</text><text x="325" y="142" text-anchor="middle" class="n">Extract</text><text x="325" y="166" text-anchor="middle" class="s q">Claude + regex:</text><text x="325" y="184" text-anchor="middle" class="s q">company, role, ids, money</text></g>
<path d="M410 145H440" class="ln" marker-end="url(#a)"/>
<g><rect x="440" y="90" width="170" height="110" rx="10" class="acc"/><text x="460" y="118" class="m s q">03</text><text x="525" y="142" text-anchor="middle" class="n">Verify in parallel</text><text x="525" y="166" text-anchor="middle" class="s q">Search · Fetch · RDAP</text><text x="525" y="184" text-anchor="middle" class="s q">DNS · URLhaus</text></g>
<path d="M610 145H640" class="ln" marker-end="url(#a)"/>
<g><rect x="640" y="90" width="170" height="110" rx="10" class="box"/><text x="660" y="118" class="m s q">04</text><text x="725" y="142" text-anchor="middle" class="n">Preliminary verdict</text><text x="725" y="166" text-anchor="middle" class="s q">rule engine score</text><text x="725" y="184" text-anchor="middle" class="s q">+ Claude's second opinion</text></g>
<path d="M810 145H840" class="ln" marker-end="url(#a)"/>
<g><rect x="840" y="90" width="170" height="110" rx="10" class="box"/><text x="860" y="118" class="m s q">05</text><text x="925" y="142" text-anchor="middle" class="n">Deep agents</text><text x="925" y="166" text-anchor="middle" class="s q">cybercrime registry, MCA,</text><text x="925" y="184" text-anchor="middle" class="s q">careers portal · live preview</text></g>
<path d="M1010 145H1040" class="ln" marker-end="url(#a)"/>
<g><rect x="1040" y="90" width="130" height="110" rx="10" class="box"/><text x="1060" y="118" class="m s q">06</text><text x="1105" y="142" text-anchor="middle" class="n">Final</text><text x="1105" y="166" text-anchor="middle" class="s q">receipts, next</text><text x="1105" y="184" text-anchor="middle" class="s q">steps, share</text></g>
<text x="125" y="236" text-anchor="middle" class="m s q">t = 0 s</text><text x="325" y="236" text-anchor="middle" class="m s q">1–5 s</text><text x="525" y="236" text-anchor="middle" class="m s q">2–20 s</text><text x="725" y="236" text-anchor="middle" class="m s q">≈ 15–25 s</text><text x="925" y="236" text-anchor="middle" class="m s q">up to 180 s</text><text x="1105" y="236" text-anchor="middle" class="m s q">done</text>
<rect x="40" y="270" width="1130" height="120" rx="10" class="tint"/><text x="60" y="300" class="n">What the student sees while it runs</text>
<text x="60" y="328" class="s">Twelve signal rows start grey and flip to green, amber or red as each resolves. The score ledger draws a bar per signal from the 50 baseline.</text>
<text x="60" y="350" class="s">Agent rows show live step text and a “Watch live” button that opens TinyFish's browser view. Research, screenshots and a careers watch are on demand.</text>
<text x="60" y="372" class="s">On-demand after the verdict: deep research dossier, visual receipts (screenshots), “Watch this role”, share card, feedback, delete.</text>
</svg></body></html>
