<text x="40" y="44" class="t" font-size="22">Start at 50. Risk adds, reassurance subtracts.</text>
<g font-size="12" class="m">
<text x="200" y="84" text-anchor="middle" class="q">0</text><text x="492" y="84" text-anchor="middle" class="q">30</text><text x="686" y="84" text-anchor="middle" class="q">50</text><text x="783" y="84" text-anchor="middle" class="q">60</text><text x="1172" y="84" text-anchor="middle" class="q">100</text>
</g>
<rect x="200" y="92" width="292" height="22" fill="rgba(26,127,75,.12)"/><rect x="492" y="92" width="291" height="22" fill="rgba(179,98,26,.14)"/><rect x="783" y="92" width="389" height="22" fill="rgba(192,57,43,.12)"/>
<text x="346" y="108" text-anchor="middle" class="m" font-size="11" fill="#1A7F4B">LIKELY GENUINE</text><text x="637" y="108" text-anchor="middle" class="m" font-size="11" fill="#B3621A">BE CAREFUL</text><text x="977" y="108" text-anchor="middle" class="m" font-size="11" fill="#C0392B">HIGH RISK</text>
<line x1="686" y1="92" x2="686" y2="420" stroke="#8B8D98" stroke-dasharray="4 4"/><text x="686" y="134" text-anchor="middle" class="m s q">start 50</text>
<g class="m" font-size="12">
<text x="60" y="166">S1  Money asked</text><text x="660" y="166" text-anchor="end" fill="#C0392B">+40</text><rect x="686" y="152" width="389" height="18" fill="#C0392B" fill-opacity=".85"/>
<text x="60" y="200">S2  Lookalike sender domain</text><text x="660" y="200" text-anchor="end" fill="#C0392B">+30</text><rect x="1075" y="186" width="97" height="18" fill="#C0392B" fill-opacity=".85"/>
<text x="60" y="234">S3  Domain age &lt; 180 d</text><text x="660" y="234" text-anchor="end" fill="#C0392B">+20</text><rect x="1172" y="220" width="0" height="18" fill="#C0392B"/><text x="1160" y="234" text-anchor="end" class="s q">clamped at 100</text>
<text x="60" y="268">S7  Company active in MCA</text><text x="660" y="268" text-anchor="end" fill="#1A7F4B">−10</text><rect x="1075" y="254" width="97" height="18" fill="#1A7F4B" fill-opacity=".85"/>
<text x="60" y="302">S8  Role on careers page</text><text x="660" y="302" text-anchor="end" fill="#1A7F4B">−20</text><rect x="880" y="288" width="195" height="18" fill="#1A7F4B" fill-opacity=".85"/>
<text x="60" y="336">S9  Contact via WhatsApp only</text><text x="660" y="336" text-anchor="end" fill="#C0392B">+10</text><rect x="880" y="322" width="97" height="18" fill="#C0392B" fill-opacity=".85"/>
<text x="60" y="370">S6  Registry not run</text><text x="660" y="370" text-anchor="end" class="q">?</text><rect x="972" y="356" width="12" height="18" fill="none" stroke="#8B8D98"/>
</g>
<line x1="977" y1="92" x2="977" y2="420" stroke="#0E7C6B" stroke-width="2"/><rect x="947" y="424" width="60" height="26" rx="4" fill="#0E7C6B"/><text x="977" y="442" text-anchor="middle" class="m" font-size="13" fill="#fff">80</text>
<text x="60" y="480" class="s">Example: a money demand (+40), a lookalike sender domain (+30) and a young domain (+20) hit the 100 ceiling; an active registry record (−10) and the role found on</text>
<text x="60" y="500" class="s">the official careers page (−20) pull it back to 80. The hard rule still applies: money plus a lookalike domain can never score below 60.</text>
